services:
    server:
        build: ./IndDevSatCon
        container_name: server
        environment:
            - SERVER_PORT=8080
        ports:
            - "8080:8080"
        networks:
            - space-net
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
            
    mission-service:
        build: ./IndDevMissionService
        container_name: mission-service
        depends_on:
            server:
                condition: service_healthy
        environment:
            - SERVER_PORT=8081
            - SERVER_URL=http://server:8080
        ports:
            - "8081:8081"
        networks:
            - space-net
            
networks:
    space-net:
        driver: bridge